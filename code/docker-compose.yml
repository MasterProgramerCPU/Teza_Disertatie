services:
  yugabyte:
    image: yugabytedb/yugabyte:2.21.1.0-b271
    container_name: emedicine-yugabyte
    command:
      - bin/yugabyted
      - start
      - --background=false
      - --tserver_flags=ysql_num_shards_per_tserver=4
    ports:
      - "5433:5433"
      - "7000:7000"
      - "9000:9000"
    volumes:
      - yugabyte-data:/root/var
    healthcheck:
      test: ["CMD-SHELL", "bin/ysqlsh -h yugabyte -p 5433 -U yugabyte -c 'SELECT 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: emedicine-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    container_name: emedicine-migrate
    depends_on:
      yugabyte:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://yugabyte:yugabyte@yugabyte:5433/yugabyte?sslmode=disable
      - up
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: emedicine-api
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://yugabyte:yugabyte@yugabyte:5433/yugabyte?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me}"
      RUNNER_DATABASE_URL: "postgres://yugabyte:yugabyte@yugabyte:5433/yugabyte?sslmode=disable"
    ports:
      - "8080:8080"
    restart: unless-stopped

  runner-python:
    build:
      context: ./runners/python
      dockerfile: Dockerfile
    container_name: emedicine-runner-python
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgres://yugabyte:yugabyte@yugabyte:5433/yugabyte?sslmode=disable"
    restart: unless-stopped

  runner-r:
    build:
      context: ./runners/r
      dockerfile: Dockerfile
    container_name: emedicine-runner-r
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgres://yugabyte:yugabyte@yugabyte:5433/yugabyte?sslmode=disable"
    restart: unless-stopped

  runner-julia:
    build:
      context: ./runners/julia
      dockerfile: Dockerfile
    container_name: emedicine-runner-julia
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: "redis://redis:6379/0"
      DATABASE_URL: "postgres://yugabyte:yugabyte@yugabyte:5433/yugabyte?sslmode=disable"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: emedicine-frontend
    depends_on:
      - api
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  yugabyte-data:
