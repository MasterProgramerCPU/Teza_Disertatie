server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy catre API-ul din cluster. Asigura ca apelurile /api/ merg indiferent
    # daca panoul e accesat prin ingress sau direct (de exemplu prin port-forward
    # catre serviciul frontend-admin). Fara acest bloc, /api/... ar cadea pe
    # try_files si ar primi index.html in loc de JSON.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64M;
    }

    # SPA standalone la admin.sir-workbench.ro. Rutele necunoscute cad pe
    # /index.html (Vue Router in mod history). index.html este servit cu
    # no-cache, ca un deploy nou (cu alte hash-uri de chunk) sa fie preluat
    # imediat; asset-urile cu hash raman cache-uite agresiv mai jos.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Cache pentru asset-urile cu hash din /assets/
    location ~* ^/assets/.*\.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|svg|gif|ico)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
