server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA standalone la admin.sir-workbench.ro. Toate rutele necunoscute cad pe /index.html
    # pentru a permite Vue Router in mod history.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache pentru asset-urile cu hash din /assets/
    location ~* ^/assets/.*\.(?:js|css|woff2?|ttf|otf|png|jpg|jpeg|svg|gif|ico)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
