# Ingress nginx pentru rutarea traficului HTTP extern.
# Presupune că nginx-ingress controller este deja instalat în cluster
# (https://kubernetes.github.io/ingress-nginx/deploy/).
#
# Pentru testare locală, mapează în /etc/hosts:
#   127.0.0.1  sir-workbench.ro
#   127.0.0.1  admin.sir-workbench.ro
#
# Pentru producție, înlocuiește host-urile cu FQDN-uri reale și adaugă o
# secțiune `tls:` cu un Secret de tip kubernetes.io/tls (cert-manager etc.).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: epimodel-ingress
  namespace: epimodel
  labels:
    app.kubernetes.io/part-of: epimodel
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    # Host principal — aplicația user-facing + API
    - host: sir-workbench.ro
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    # Host dedicat pentru consola super-admin
    - host: admin.sir-workbench.ro
      http:
        paths:
          # API-ul rămâne accesibil și de pe sub-domain (apelurile XHR
          # din admin SPA folosesc /api/... relativ la admin.sir-workbench.ro).
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-admin
                port:
                  number: 80
