# Job care aplica migrațiile SQL pe YugabyteDB.
# Migrațiile sunt încărcate dintr-un ConfigMap generat din ./db/migrations/.
#
# Înainte de a aplica acest Job, generează ConfigMap-ul:
#
#   kubectl create configmap db-migrations \
#     --namespace=epimodel \
#     --from-file=code/db/migrations/
#
# YugabyteDB nu suportă (încă) advisory locks pe care golang-migrate le folosește,
# așa că rulăm migrațiile direct cu psql, în ordine alfabetică a fișierelor *.up.sql.
# Job-ul foloseste IF NOT EXISTS în migrații pentru idempotență.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: epimodel
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/part-of: epimodel
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/part-of: epimodel
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-ysql
          image: postgres:16-alpine
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: epimodel-secrets
                  key: DATABASE_URL
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -d "$DATABASE_URL"; do
                echo "waiting for YSQL ..."
                sleep 3
              done
              echo "YSQL is ready"
      containers:
        - name: migrate
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: epimodel-secrets
                  key: DATABASE_URL
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Applying migrations in order..."
              for f in $(ls /migrations/*.up.sql | sort); do
                echo ""
                echo "=== Applying $f ==="
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
              done
              echo ""
              echo "All migrations applied successfully."
              psql "$DATABASE_URL" -c "\dt"
          volumeMounts:
            - name: migrations
              mountPath: /migrations
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: migrations
          configMap:
            name: db-migrations
