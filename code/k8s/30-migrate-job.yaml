# Job care aplica migrațiile SQL pe YugabyteDB.
# Migrațiile sunt încărcate dintr-un ConfigMap generat din ./db/migrations/.
#
# Înainte de a aplica acest Job, generează ConfigMap-ul:
#
#   kubectl create configmap db-migrations \
#     --namespace=epimodel \
#     --from-file=code/db/migrations/
#
# Job-ul re-rulează idempotent; dacă vrei să-l forțezi după o nouă migrație,
# șterge-l (kubectl delete job db-migrate -n epimodel) și aplică-l din nou.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  namespace: epimodel
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/part-of: epimodel
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/part-of: epimodel
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-ysql
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z yb-tserver 5433; do
                echo "waiting for yb-tserver:5433..."
                sleep 3
              done
              echo "yb-tserver is ready"
      containers:
        - name: migrate
          image: migrate/migrate:v4.17.1
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: epimodel-secrets
                  key: DATABASE_URL
          command:
            - migrate
            - -path=/migrations
            - -database=$(DATABASE_URL)
            - up
          volumeMounts:
            - name: migrations
              mountPath: /migrations
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: migrations
          configMap:
            name: db-migrations
