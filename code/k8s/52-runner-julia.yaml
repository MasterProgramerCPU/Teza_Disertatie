apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-julia
  namespace: epimodel
  labels:
    app.kubernetes.io/name: runner-julia
    app.kubernetes.io/component: runner
    app.kubernetes.io/part-of: epimodel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: runner-julia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner-julia
        app.kubernetes.io/component: runner
        app.kubernetes.io/part-of: epimodel
    spec:
      terminationGracePeriodSeconds: 60
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: runner-julia
          image: ghcr.io/masterprogramercpu/emedicine-runner-julia:latest
          imagePullPolicy: Always
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: epimodel-config
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: epimodel-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 1Gi
