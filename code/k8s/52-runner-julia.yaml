apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-julia
  namespace: epimodel
  labels:
    app.kubernetes.io/name: runner-julia
    app.kubernetes.io/component: runner
    app.kubernetes.io/part-of: epimodel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: runner-julia
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runner-julia
        app.kubernetes.io/component: runner
        app.kubernetes.io/part-of: epimodel
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: runner-julia
          image: emedicine/runner-julia:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: epimodel-config
                  key: REDIS_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: epimodel-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
