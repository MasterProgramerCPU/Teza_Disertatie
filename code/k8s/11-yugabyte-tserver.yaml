apiVersion: v1
kind: Service
metadata:
  name: yb-tservers
  namespace: epimodel
  labels:
    app.kubernetes.io/name: yb-tserver
    app.kubernetes.io/part-of: epimodel
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: rpc
      port: 9100
      targetPort: 9100
    - name: ui
      port: 9000
      targetPort: 9000
    - name: ysql
      port: 5433
      targetPort: 5433
  selector:
    app.kubernetes.io/name: yb-tserver
---
apiVersion: v1
kind: Service
metadata:
  name: yb-tserver
  namespace: epimodel
  labels:
    app.kubernetes.io/name: yb-tserver
    app.kubernetes.io/part-of: epimodel
spec:
  type: ClusterIP
  ports:
    - name: ysql
      port: 5433
      targetPort: 5433
  selector:
    app.kubernetes.io/name: yb-tserver
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yb-tserver
  namespace: epimodel
  labels:
    app.kubernetes.io/name: yb-tserver
    app.kubernetes.io/part-of: epimodel
spec:
  serviceName: yb-tservers
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: yb-tserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yb-tserver
        app.kubernetes.io/part-of: epimodel
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: yb-tserver
                topologyKey: kubernetes.io/hostname
      containers:
        - name: yb-tserver
          image: yugabytedb/yugabyte:2.21.1.0-b271
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/bash
            - -c
            - >
              /home/yugabyte/bin/yb-tserver
              --fs_data_dirs=/mnt/data0
              --tserver_master_addrs=yb-master-0.yb-masters.${NAMESPACE}.svc.cluster.local:7100,yb-master-1.yb-masters.${NAMESPACE}.svc.cluster.local:7100,yb-master-2.yb-masters.${NAMESPACE}.svc.cluster.local:7100
              --rpc_bind_addresses=${POD_NAME}.yb-tservers.${NAMESPACE}.svc.cluster.local:9100
              --server_broadcast_addresses=${POD_NAME}.yb-tservers.${NAMESPACE}.svc.cluster.local:9100
              --enable_ysql=true
              --pgsql_proxy_bind_address=0.0.0.0:5433
              --cql_proxy_bind_address=0.0.0.0:9042
              --webserver_interface=0.0.0.0
              --ysql_num_shards_per_tserver=4
              --logtostderr
          ports:
            - name: rpc
              containerPort: 9100
            - name: ui
              containerPort: 9000
            - name: ysql
              containerPort: 5433
            - name: ycql
              containerPort: 9042
          volumeMounts:
            - name: data
              mountPath: /mnt/data0
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 5433
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 9100
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
