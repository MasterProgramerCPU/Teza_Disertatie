apiVersion: v1
kind: Service
metadata:
  name: yb-masters
  namespace: epimodel
  labels:
    app.kubernetes.io/name: yb-master
    app.kubernetes.io/part-of: epimodel
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: rpc
      port: 7100
      targetPort: 7100
    - name: ui
      port: 7000
      targetPort: 7000
  selector:
    app.kubernetes.io/name: yb-master
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: yb-master
  namespace: epimodel
  labels:
    app.kubernetes.io/name: yb-master
    app.kubernetes.io/part-of: epimodel
spec:
  serviceName: yb-masters
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: yb-master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: yb-master
        app.kubernetes.io/part-of: epimodel
    spec:
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: yb-master
                topologyKey: kubernetes.io/hostname
      containers:
        - name: yb-master
          image: yugabytedb/yugabyte:2.21.1.0-b271
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          command:
            - /bin/bash
            - -c
            - >
              /home/yugabyte/bin/yb-master
              --fs_data_dirs=/mnt/data0
              --master_addresses=yb-master-0.yb-masters.${NAMESPACE}.svc.cluster.local:7100,yb-master-1.yb-masters.${NAMESPACE}.svc.cluster.local:7100,yb-master-2.yb-masters.${NAMESPACE}.svc.cluster.local:7100
              --rpc_bind_addresses=${POD_NAME}.yb-masters.${NAMESPACE}.svc.cluster.local:7100
              --server_broadcast_addresses=${POD_NAME}.yb-masters.${NAMESPACE}.svc.cluster.local:7100
              --webserver_interface=0.0.0.0
              --replication_factor=3
              --logtostderr
          ports:
            - name: rpc
              containerPort: 7100
            - name: ui
              containerPort: 7000
          volumeMounts:
            - name: data
              mountPath: /mnt/data0
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 7100
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 7100
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
