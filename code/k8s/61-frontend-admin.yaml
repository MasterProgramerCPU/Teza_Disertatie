apiVersion: v1
kind: Service
metadata:
  name: frontend-admin
  namespace: epimodel
  labels:
    app.kubernetes.io/name: frontend-admin
    app.kubernetes.io/part-of: epimodel
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 80
  selector:
    app.kubernetes.io/name: frontend-admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-admin
  namespace: epimodel
  labels:
    app.kubernetes.io/name: frontend-admin
    app.kubernetes.io/part-of: epimodel
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-admin
        app.kubernetes.io/part-of: epimodel
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: frontend-admin
          image: ghcr.io/masterprogramercpu/emedicine-frontend-admin:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
