# Template pentru Secret-ul cu valorile sensibile.
# NU aplica acest fișier direct cu valorile placeholder.
#
# Generează un Secret real cu o comandă imperativă, de exemplu:
#
#   kubectl create secret generic epimodel-secrets \
#     --namespace=epimodel \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=DATABASE_URL="postgres://yugabyte:yugabyte@yb-tserver-service:5433/yugabyte?sslmode=disable"
#
# Sau editează acest fișier înlocuind valorile dintre <...> și aplică-l manual.
apiVersion: v1
kind: Secret
metadata:
  name: epimodel-secrets
  namespace: epimodel
  labels:
    app.kubernetes.io/part-of: epimodel
type: Opaque
stringData:
  JWT_SECRET: "<inlocuieste-cu-un-secret-puternic-min-32-chars>"
  DATABASE_URL: "postgres://yugabyte:yugabyte@yb-tserver-service:5433/yugabyte?sslmode=disable"
