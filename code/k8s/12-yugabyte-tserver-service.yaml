apiVersion: v1
kind: Service
metadata:
  name: yb-tserver-service
  namespace: epimodel
  labels:
    app: yb-tserver
    app.kubernetes.io/part-of: epimodel
spec:
  type: ClusterIP
  selector:
    app: yb-tserver
  ports:
    - name: tcp-yql-port
      port: 9042
      targetPort: 9042
    - name: tcp-ysql-port
      port: 5433
      targetPort: 5433
