apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: epimodel
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: epimodel
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app.kubernetes.io/name: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: epimodel
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: epimodel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: epimodel
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 512Mi
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          # Fara persistenta — folosim emptyDir pentru a economisi un volum OpenStack
          # (quota tenant 10 vol, prioritizam Yugabyte RF=3). Cozile se pierd la restart Pod,
          # dar simularile dureaza secunde, nu zile.
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
